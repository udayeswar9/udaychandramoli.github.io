<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Netflix Clone</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #000;
      color: #fff;
    }
    .hero {
      background-image: url('netback.jpg');
      background-size: cover;
      background-position: center;
      height: 90vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 0 20px;
    }
    .hero h1 {
      font-size: 3rem;
      margin-bottom: 1rem;
    }
    .hero p {
      font-size: 1.25rem;
      margin-bottom: 2rem;
    }
    .hero input[type=email] {
      padding: 10px;
      width: 300px;
      font-size: 1rem;
      margin-right: 10px;
    }
    .hero button {
      padding: 10px 20px;
      font-size: 1rem;
      background-color: red;
      color: white;
      border: none;
      cursor: pointer;
    }
    header {
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: rgba(0, 0, 0, 0.8);
      position: absolute;
      width: 100%;
      top: 0;
    }
    header .logo {
      font-size: 1.5rem;
      font-weight: bold;
    }
    header .sign-in {
      background: red;
      padding: 8px 16px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">NETFLIX</div><br>

    <div class="sign-in">Sign In</div>
  </header>  <div class="hero">
    <h1>Unlimited movies, TV shows, and more</h1>
    <p>Watch anywhere. Cancel anytime.</p>
    <form>
      <input type="email" placeholder="Email address" required>
      <button type="submit">Get Started</button>
    </form>
  </div>
</body>
</html>
